interests:
  My research lies at the intersection of network optimization, artificial intelligence, and next-generation mobile networks. Key areas of interest include:

   - O-RAN, Open 5G/6G, and Cloud-Native Network Architectures
   - Operational Research for Communication Networks
   - Mathematical Modeling and Optimization of Networked Systems
   - Online and Multi-Agent Reinforcement Learning for Autonomous Network Management
   - Intent-Based Networking and AI-Driven Automation
   - Sustainable and Green Networking
   - Large-Scale Experimental Validation using Advanced Research Infrastructures (e.g., SLICES-RI, Colosseum)
   - Network Emulation, Digital Twins, and Real-World Testbed Deployment


